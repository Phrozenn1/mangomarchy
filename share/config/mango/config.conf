# =============================================================================
# Mangomarchy Configuration (~/.config/mango/config.conf)
# =============================================================================
# Read https://mangowm.github.io/ for full MangoWC configuration syntax.
# Stock Mangomarchy defaults live in ~/.local/share/mangomarchy/default/mango/
# Customize your setup in the sourced files below (`monitors.conf`, `input.conf`,
# `looknfeel.conf`, `bindings.conf`).

# 1. Dynamic Omarchy Theme Colors
source_optional=~/.local/state/omarchy/current/theme/mango-theme.conf

# 2. Mangomarchy System Defaults
source_optional=~/.local/share/mangomarchy/default/mango/autostart.conf
source_optional=~/.local/share/mangomarchy/default/mango/looknfeel.conf
source_optional=~/.local/share/mangomarchy/default/mango/rules.conf
source_optional=~/.local/share/mangomarchy/default/mango/bindings.conf

# Legacy fallback (if migrating from omarchy-mango)
source_optional=~/.local/share/omarchy-mango/default/mango/autostart.conf
source_optional=~/.local/share/omarchy-mango/default/mango/looknfeel.conf
source_optional=~/.local/share/omarchy-mango/default/mango/rules.conf
source_optional=~/.local/share/omarchy-mango/default/mango/bindings.conf

# 3. User Customizations
source_optional=~/.config/mango/monitors.conf
source_optional=~/.config/mango/input.conf
source_optional=~/.config/mango/looknfeel.conf
source_optional=~/.config/mango/bindings.conf
