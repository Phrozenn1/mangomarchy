# User Look & Feel Overrides for MangoWC (mangowm 0.18+)
# Override defaults from ~/.local/share/omarchy-mango/default/mango/looknfeel.conf here.
#
# Examples:
# border_px=2
# border_radius=8
# gap_inner_horizontal=5
# gap_inner_vertical=5
# gap_outer_horizontal=10
# gap_outer_vertical=10
#
# Switch default layout per tag (scroller, tile, dwindle, grid, monocle, deck, center_tile):
# tag_rule=id:1,layout_name:scroller
# tag_rule=id:2,layout_name:tile
