# Monitor Configuration for MangoWC (mangowm 0.18+)
# Syntax:
#   monitor_rule=name:<output>,width:<w>,height:<h>,refresh:<hz>,x:<x>,y:<y>,scale:<scale>,vrr:<0|1>,rr:<0-7>
#
# Examples:
#   monitor_rule=name:eDP-1,width:2880,height:1920,refresh:120,x:0,y:0,scale:2.0,vrr:1,rr:0
#   monitor_rule=name:DP-1,width:3840,height:2160,refresh:144,x:1440,y:0,scale:1.5,vrr:1,rr:0
#
# When left empty, MangoWC automatically configures all connected displays
# at their preferred resolution and refresh rate.
