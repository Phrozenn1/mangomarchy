# Keyboard, Mouse, and Touchpad Settings for MangoWC (mangowm 0.18+)

# Keyboard layout and repeat rate
xkb_rules_layout=us
# xkb_rules_variant=
xkb_rules_options=compose:caps
repeat_rate=40
repeat_delay=600
numlock_on=1

# Touchpad / Mouse
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
mouse_natural_scrolling=0
trackpad_disable_while_typing=1

# Focus behavior
sloppy_focus=1
drag_warp_cursor=1
