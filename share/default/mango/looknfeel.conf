# Omarchy MangoWC Look & Feel Defaults (mangowm 0.18+)

# Borders and gaps matching Omarchy's Hyprland aesthetic
border_px=2
no_border_when_single=0
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
smart_gaps=0

# SceneFX visual effects
border_radius=0
blur=0
blur_layer=0
shadows=0
layer_shadows=0

# Smooth animations
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
animation_duration_move=250
animation_duration_open=220
animation_duration_tag=220
animation_duration_close=180

# Scroller layout defaults (Niri-like scrolling workflow)
scroller_structs=20
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=1
scroller_proportion_preset=0.33,0.5,0.67,1.0

# Master-Stack (Tile) layout defaults
new_is_master=1
default_master_factor=0.5
default_master_count=1
center_master_overspread=1
center_when_single_stack=1

# Default all 9 tags to scroller layout (change to tile/dwindle/grid/monocle in ~/.config/mango/looknfeel.conf)
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller
