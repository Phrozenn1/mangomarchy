# Omarchy MangoWC Window & Layer Rules (mangowm 0.18+)

# Quickshell & layer surface rules
layer_rule=layer_name:quickshell.*,no_animation:1
layer_rule=layer_name:omarchy-.*,no_animation:1
layer_rule=layer_name:selection,no_animation:1

# System dialogs and TUI utilities (floating)
window_rule=app_id:^(org\.pulseaudio\.pavucontrol|wiremix|blueberry\.py|impala|bluetui)$,is_floating:1,width:800,height:600
window_rule=app_id:^(1password|Bitwarden)$,is_floating:1,width:960,height:680
window_rule=app_id:^(xdg-desktop-portal-gtk)$,is_floating:1,width:900,height:640

# Picture-in-Picture windows
window_rule=title:^(Picture-in-Picture|Picture in picture)$,is_floating:1,is_global:1,width:640,height:360

# Media & image viewers
window_rule=app_id:^(mpv|imv|evince|org\.gnome\.Loupe)$,is_floating:1

# Steam auxiliary windows
window_rule=app_id:^(steam)$,title:^(Friends List|Steam - News.*)$,is_floating:1
