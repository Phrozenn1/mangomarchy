# Omarchy MangoWC Autostart (mangowm 0.18+)
# Propagate Wayland environment to systemd and D-Bus for portals, notifications, and Quickshell
exec_once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE MANGO_INSTANCE_SIGNATURE PATH
exec_once=systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE MANGO_INSTANCE_SIGNATURE PATH

# Start the Omarchy MangoWC <-> Hyprland socket bridge before Quickshell
exec_once=omarchy-mango-bridge

# Core Omarchy services & desktop shell
exec_once=hypridle
exec_once=omarchy-shell
exec_once=swaybg -i ~/.local/state/omarchy/current/background -m fill
exec_once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec_once=omarchy-cmd-first-run
exec_once=wl-clip-persist --clipboard regular --all-mime-type-regex '^(?!x-kde-passwordManagerHint).+'
exec_once=fcitx5
