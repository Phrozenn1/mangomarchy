# Omarchy MangoWC Autostart (mangowm 0.18+)
# Propagate Wayland environment to systemd and D-Bus for portals, notifications, and Quickshell
exec_once=dbus-update-activation-environment --systemd --all
exec_once=systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE MANGO_INSTANCE_SIGNATURE OMARCHY_SESSION_ID PATH

# Ensure the Mangomarchy (MangoWC <-> Hyprland) socket bridge is running before Quickshell
exec_once=pgrep -f mangomarchy-bridge >/dev/null || command -v mangomarchy-bridge >/dev/null && mangomarchy-bridge || omarchy-mango-bridge

# Core Omarchy v4 services & desktop shell (matching /usr/share/omarchy/default/hypr/autostart.lua)
exec_once=omarchy-launch-shell
exec_once=omarchy-provision-first-run
exec_once=omarchy-powerprofiles-init
exec_once=uwsm-app -- udiskie --automount --no-notify --no-tray
exec_once=uwsm-app -- herdr server
exec_once=sh -c "sleep 2 && omarchy-hook post-boot"
