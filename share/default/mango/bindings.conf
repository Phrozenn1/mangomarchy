# =============================================================================
# Omarchy MangoWC Default Keybindings (Full Omarchy Parity + MangoWC Features)
# =============================================================================

# --- Core Applications & Launchers ---
bind=SUPER,Return,spawn,uwsm-app -- xdg-terminal-exec
bind=SUPER,space,spawn,omarchy-menu toggle apps
bind=SUPER+ALT,space,spawn,omarchy-menu toggle root
bind=SUPER,Escape,spawn,omarchy-menu toggle system
bind=SUPER,K,spawn,omarchy-menu-keybindings

bind=SUPER+SHIFT,F,spawn,uwsm-app -- nautilus --new-window
bind=SUPER+SHIFT+ALT,F,spawn,uwsm-app -- xdg-terminal-exec yazi
bind=SUPER+SHIFT,B,spawn,omarchy-launch-browser
bind=SUPER+SHIFT+ALT,B,spawn,omarchy-launch-browser --private
bind=SUPER+SHIFT,N,spawn,omarchy-launch-editor
bind=SUPER+SHIFT,T,spawn,omarchy-launch-or-focus-tui btop
bind=SUPER+SHIFT,D,spawn,omarchy-launch-tui lazydocker
bind=SUPER+SHIFT,G,spawn,omarchy-launch-or-focus signal "uwsm-app -- signal-desktop"
bind=SUPER+SHIFT,O,spawn,omarchy-launch-or-focus "^obsidian$" "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"
bind=SUPER+SHIFT,M,spawn,omarchy-launch-or-focus spotify
bind=SUPER,slash,spawn,uwsm-app -- 1password

# --- Window Management ---
bind=SUPER,W,killclient
bind=SUPER,Q,killclient
bind=CTRL+ALT,Delete,spawn,omarchy-hyprland-window-close-all

bind=SUPER,T,togglefloating
bind=SUPER,F,togglefullscreen
bind=SUPER+ALT,F,togglemaximizescreen
bind=SUPER,O,toggleoverlay

# Cycle workspace / tag layouts (scroller -> tile -> monocle)
bind=SUPER,L,spawn,omarchy-hyprland-workspace-layout-toggle
bind=SUPER+ALT,L,spawn,omarchy-hyprland-workspace-layout-toggle back
bind=SUPER,J,switch_layout

# Scroller-specific proportions & centering (MangoWC bonus)
bind=SUPER,R,switch_proportion_preset
bind=SUPER,C,set_proportion,1.0

# Directional Focus
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# Directional Window Swap / Move
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# Cycle Windows & Overview
bind=ALT,Tab,focusstack,next
bind=ALT+SHIFT,Tab,focusstack,prev
bind=SUPER,Tab,toggleoverview
bind=SUPER+SHIFT,Tab,viewtoleft_have_client

# Scratchpad
bind=SUPER,S,toggle_scratchpad
bind=SUPER+ALT,S,minimized

# Resize Active Window
bind=SUPER,equal,resizewin,+40,+0
bind=SUPER,minus,resizewin,-40,+0
bind=SUPER+SHIFT,equal,resizewin,+0,+40
bind=SUPER+SHIFT,minus,resizewin,+0,-40

# --- Tags / Workspaces (1-9 & 0) ---
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,0,view,9

# Move active window to tag (1-9)
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# Multi-Tag View & Toggling (MangoWC Tag Power-Feature)
bind=SUPER+ALT,1,toggleview,1
bind=SUPER+ALT,2,toggleview,2
bind=SUPER+ALT,3,toggleview,3
bind=SUPER+ALT,4,toggleview,4
bind=SUPER+ALT,5,toggleview,5
bind=SUPER+ALT,6,toggleview,6
bind=SUPER+ALT,7,toggleview,7
bind=SUPER+ALT,8,toggleview,8
bind=SUPER+ALT,9,toggleview,9

# Multi-Monitor Focus & Window Move
bind=CTRL+ALT,Tab,focusmon,next
bind=SUPER+SHIFT+CTRL,Left,tagmon,left
bind=SUPER+SHIFT+CTRL,Right,tagmon,right
bind=SUPER+SHIFT+CTRL,Up,tagmon,up
bind=SUPER+SHIFT+CTRL,Down,tagmon,down

# --- Omarchy Shell Panels, Clipboard, Notifications & Utilities ---
bind=SUPER+CTRL,V,spawn,omarchy-shell shell toggle omarchy.clipboard
bind=SUPER+CTRL,E,spawn,omarchy-shell shell toggle omarchy.emojis
bind=SUPER+CTRL,A,spawn,omarchy-shell shell toggle omarchy.audio
bind=SUPER+CTRL,B,spawn,omarchy-shell shell toggle omarchy.bluetooth
bind=SUPER+CTRL,D,spawn,omarchy-shell shell toggle omarchy.monitor
bind=SUPER+CTRL+ALT,D,spawn,omarchy-shell shell toggle omarchy.clock
bind=SUPER+CTRL+ALT,E,spawn,omarchy-shell shell toggle omarchy.elsewhen
bind=SUPER+CTRL,W,spawn,omarchy-shell shell toggle omarchy.network
bind=SUPER+CTRL,P,spawn,omarchy-shell shell toggle omarchy.power
bind=SUPER+SHIFT+CTRL,A,spawn,omarchy-agent --pick

bind=SUPER,comma,spawn,omarchy-shell omarchy.notifications dismiss
bind=SUPER+SHIFT,comma,spawn,omarchy-shell omarchy.notifications dismissAll
bind=SUPER+CTRL,comma,spawn,omarchy-shell omarchy.notifications toggleDnd
bind=SUPER+ALT,comma,spawn,omarchy-shell omarchy.notifications invoke

# --- Aesthetics, Theme & Toggles ---
bind=SUPER+SHIFT,space,spawn,omarchy-bar toggle
bind=SUPER+CTRL+SHIFT,space,spawn,omarchy-menu toggle theme
bind=SUPER+CTRL,space,spawn,omarchy-theme-bg-next
bind=SUPER+CTRL,N,spawn,omarchy-toggle-nightlight
bind=SUPER+CTRL,I,spawn,omarchy-toggle-idle
bind=SUPER,BackSpace,spawn,omarchy-hyprland-window-transparency-toggle
bind=SUPER+SHIFT,BackSpace,spawn,omarchy-hyprland-window-gaps-toggle
bind=SUPER+SHIFT,R,reload_config

# --- Screenshots, Recording & Color Picker ---
bind=NONE,Print,spawn,omarchy-capture-screenshot
bind=SHIFT,Print,spawn,omarchy-capture-screenshot windows
bind=CTRL,Print,spawn,omarchy-capture-screenshot fullscreen
bind=ALT,Print,spawn,omarchy-menu toggle screenrecord
bind=SUPER,Print,spawn,pkill hyprpicker || hyprpicker -a
bind=SUPER+CTRL,Print,spawn,omarchy-capture-text
bind=SUPER+CTRL,S,spawn,omarchy-menu toggle share
bind=SUPER+CTRL,L,spawn,omarchy-system-lock

# --- Media, Volume & Brightness Keys ---
bind=NONE,XF86AudioRaiseVolume,spawn,omarchy-audio-output-volume raise
bind=NONE,XF86AudioLowerVolume,spawn,omarchy-audio-output-volume lower
bind=NONE,XF86AudioMute,spawn,omarchy-audio-output-volume mute
bind=ALT,XF86AudioRaiseVolume,spawn,omarchy-audio-output-volume raise-fine
bind=ALT,XF86AudioLowerVolume,spawn,omarchy-audio-output-volume lower-fine
bind=NONE,XF86AudioMicMute,spawn,omarchy-audio-input-mute
bind=NONE,XF86MonBrightnessUp,spawn,omarchy-brightness-display +5%
bind=NONE,XF86MonBrightnessDown,spawn,omarchy-brightness-display 5%-
bind=ALT,XF86MonBrightnessUp,spawn,omarchy-brightness-display +1%
bind=ALT,XF86MonBrightnessDown,spawn,omarchy-brightness-display 1%-
bind=NONE,XF86AudioNext,spawn,omarchy-shell omarchy.media next
bind=NONE,XF86AudioPrev,spawn,omarchy-shell omarchy.media previous
bind=NONE,XF86AudioPlay,spawn,omarchy-shell omarchy.media playPause

# --- Mouse Bindings (Super + Left/Right Click Drag) ---
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
