# Omarchy Minimalist Ly Display Manager Configuration Overlay
# Applied by `mangomarchy-dm use-ly` over /etc/ly/config.ini

animation = none
animate = false
clock = %a %d %b %H:%M
clear_password = true
hide_version_string = true
load = true
save = true
waylandsessions = /usr/share/wayland-sessions
xsessions = /usr/share/xsessions
